[package]
name = "mcpg-plugin-backend-snowflake"
version = "0.1.0-alpha.20"
license = "Apache-2.0"
edition = "2024"
description = """
Snowflake cloud-warehouse backend binding plugin for mcpg. Runs an
operator-fixed analytical SQL statement against a Snowflake warehouse over the
REST API and returns the rows (Arrow result sets decoded to JSON). Auth is
key-pair JWT or password, resolved through the gateway secret-resolver
(`${env.X}` / `vault://`). A read-only guard and a `max_rows` cap bound the
statement. Complements the `sql` / `mssql` / `oracle` SQL backends, whose
drivers can't speak the Snowflake REST protocol.

Pure-Rust + rustls-clean (snowflake-api → reqwest/hyper-rustls; no openssl /
native-tls / system lib — only `openssl-probe`). Pulls a heavy transitive
graph (Arrow 57 + object_store), so the first build is slow.
"""

[lib]
# cdylib: the .so the gateway's native_loader dlopens. rlib: in-tree unit
# tests + the eager new() constructor.
crate-type = ["cdylib", "rlib"]

[features]
default = []
cdylib-export = []
# Declared empty so the SDK macro's static accessor doesn't trip
# unexpected_cfgs; snowflake is consumed as a cdylib.
static-firstparty = []
# Gates the env-driven live-Snowflake integration suite so `cargo test --lib`
# stays offline (there is no Snowflake docker image). Run:
# `cargo test -p mcpg-plugin-backend-snowflake --features integration-tests`.
integration-tests = []

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
mcpg-plugin-sdk      = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18", features = ["static-firstparty"] }
mcpg-plugin-host     = { git = "https://github.com/mcpg-dev/mcpg-plugin-host", tag = "v0.1.0-beta.19", version = "=0.1.0-beta.19" }
async-trait    = "0.1"
base64         = "0.22"
chrono         = { version = "0.4", default-features = false, features = ["clock"] }
metrics        = "0.24"
# Snowflake REST driver. Pure-Rust; `cert-auth` (default) gives key-pair JWT
# via snowflake-jwt. TLS is rustls (reqwest → hyper-rustls); NO openssl /
# native-tls / system lib. Pulls a heavy Arrow 57 + object_store graph.
snowflake-api  = { version = "0.14.0", default-features = true }
# Pinned to snowflake-api's Arrow major (57) so the umbrella `arrow` and
# `arrow-json` unify with snowflake-api's arrow-array / arrow-schema — a
# version mismatch fails to compile against its RecordBatch type.
arrow          = "57"
arrow-json     = "57"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
tokio          = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tracing        = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
async-trait = "0.1"
